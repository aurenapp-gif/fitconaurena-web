name: CI

# Verifica tipos, lint y build en cada push y PR, para no romper nunca main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # Build no necesita secretos reales; valores dummy para que no falle.
          NODE_ENV: production
