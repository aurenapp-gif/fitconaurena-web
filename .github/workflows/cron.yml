name: Cron horario

# Vercel Hobby solo permite cron diario, así que llamamos a /api/cron cada hora
# desde aquí para que la secuencia de avisos del plan (6h/8h/24h) sea puntual.
on:
  schedule:
    - cron: "0 * * * *" # cada hora en punto (UTC)
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron
        run: |
          curl -fsS -X GET "https://fitconaurena.com/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
