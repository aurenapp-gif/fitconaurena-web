name: Cron (respaldo manual)

# La ejecución horaria la hace ahora el Cron NATIVO de Vercel (vercel.json), que
# en plan Pro corre cada hora de forma fiable. Antes usábamos el schedule de
# GitHub Actions porque Vercel Hobby solo permitía cron diario, pero ese
# scheduler se disparaba tarde y a saltos. Dejamos este workflow solo como
# respaldo MANUAL: se lanza a mano desde la pestaña Actions si alguna vez hace
# falta forzar una pasada del cron.
on:
  workflow_dispatch: {} # lanzar a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron
        run: |
          curl -fsS -X GET "https://fitconaurena.com/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
